<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd9ff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角方块 -->
  <rect width="512" height="512" rx="118" fill="#0e1424"/>
  <!-- 仪表外圈 -->
  <circle cx="256" cy="256" r="166" fill="none" stroke="#24325a" stroke-width="24"/>
  <!-- 四个刻度 -->
  <g stroke="#24325a" stroke-width="24">
    <line x1="256" y1="106" x2="256" y2="150"/>
    <line x1="406" y1="256" x2="362" y2="256"/>
    <line x1="256" y1="406" x2="256" y2="362"/>
    <line x1="106" y1="256" x2="150" y2="256"/>
  </g>
  <!-- 内盘 -->
  <circle cx="256" cy="256" r="112" fill="#121a2e"/>
  <!-- 指针（向右上，起飞感） -->
  <polygon points="256,296 234,158 278,158" fill="url(#pp)" transform="rotate(-38 256 256)"/>
  <circle cx="256" cy="256" r="34" fill="#24325a"/>
  <circle cx="256" cy="256" r="20" fill="url(#pp)"/>
</svg>
