[project]
name = "pteropilot"
version = "0.2.33"
description = "MCP server that lets AI agents manage game servers on Pterodactyl / Pelican panels"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "WinbowJi / telson" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "pterodactyl",
  "pelican",
  "game-server",
  "minecraft",
  "server-management",
  "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/telson-dev/pteropilot"
Repository = "https://github.com/telson-dev/pteropilot"
Documentation = "https://github.com/telson-dev/pteropilot#readme"


[project.scripts]
pteropilot = "pteropilot.server:main"
pteropilot-alerts = "pteropilot.alerts:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7.1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "ruff>=0.17",
]

# 只开「会变成 bug 的」规则，不开风格规则。
# 起因：两次在错误分支里漏了 import（server.py 缺 re、alerts.py 缺 sys），
# 都是真实用户会撞到的 NameError，但平时跑不到那条路，测试全绿。
# 风格规则（缩进、引号、import 排序）不在这里管，免得一改就是几百条噪音。
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "F821",  # 未定义的名字（NameError 的主要来源）
  "F822",  # __all__ 里写了不存在的名字
  "F823",  # 局部变量在赋值前被引用
  "F811",  # 重复定义（后面的悄悄覆盖前面的）
  "F402",  # 推导式变量覆盖外层同名变量
  "F401",  # 导入但没用的
  "F841",  # 赋值了但没用的局部变量（测试里常常意味着漏了断言）
  "E9",    # 语法层面错误
]

[tool.ruff.lint.per-file-ignores]
# 测试里有时故意 import 了给副作用用
"tests/*" = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pteropilot"]
