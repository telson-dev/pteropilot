[project]
name = "pteropilot"
version = "0.1.0"
description = "MCP server that lets AI agents manage game servers on Pterodactyl / Pelican panels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27",
]

[project.scripts]
pteropilot = "pteropilot.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pteropilot"]
