name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests -q -p no:cacheprovider --cov=pteropilot --cov-report=term --cov-fail-under=90

      - name: Build wheel + sdist
        run: uv build

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
