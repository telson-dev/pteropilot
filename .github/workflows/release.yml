name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests -q -p no:cacheprovider --cov=pteropilot --cov-report=term --cov-fail-under=90

      - name: Build wheel + sdist
        run: uv build

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # 只传分发产物：uv build 会在 dist/ 里写一个 .gitignore，
          # 用 dist/* 会把它当附件传到 Release（用户下载列表里多出无用文件）。
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
