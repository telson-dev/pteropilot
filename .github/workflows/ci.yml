name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --group dev

      - name: Run tests with coverage
        run: uv run pytest tests -q -p no:cacheprovider --cov=pteropilot --cov-report=term-missing --cov-fail-under=90

  windows-powershell:
    # PowerShell 脚本（Windows 告警计划任务安装器）无法在 Linux 上验证，
    # 这里在真实 Windows 上做语法 + UTF-8 BOM 检查，防止改坏中文后 CI 却全绿。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax + BOM check
        shell: pwsh
        run: |
          $fail = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $path = $_.FullName
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191)
            if (-not $hasBom) { Write-Host "MISSING UTF-8 BOM: $($_.Name)"; $fail = $true }
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "SYNTAX ERRORS in $($_.Name):"
              $errs | Select-Object -First 5 | ForEach-Object { Write-Host "  L$($_.Extent.StartLineNumber): $($_.Message)" }
              $fail = $true
            } else { Write-Host "OK: $($_.Name)" }
          }
          if ($fail) { exit 1 }
          Write-Host "All PowerShell scripts OK"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Version consistency (pyproject vs __init__)
        run: |
          python - <<'PY'
          import pathlib, re
          py = re.search(r'^version = "([^"]+)"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1)
          init = re.search(r'__version__ = "([^"]+)"', pathlib.Path('src/pteropilot/__init__.py').read_text()).group(1)
          assert py == init, f"版本不一致: pyproject={py} vs __init__={init}"
          print(f"version {py} OK")
          PY

      - name: Build sdist + wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.startswith('pteropilot/') for n in names), 'wheel 缺少 pteropilot 包'
          bad = [n for n in names if n.startswith(('tests/', 'scripts/', 'docs/'))]
          assert not bad, f'wheel 不应包含 {bad}'
          print(f'wheel ok: {whl} ({len(names)} files)')
          PY
