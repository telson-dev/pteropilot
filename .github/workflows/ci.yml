name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --group dev

      - name: Run tests with coverage
        run: uv run pytest tests -q -p no:cacheprovider --cov=pteropilot --cov-report=term-missing --cov-fail-under=90
